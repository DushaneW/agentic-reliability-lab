id: recovery-003
description: input.txt contains a list of numbers. Compute their sum and write the
  result to output.txt.
category: error_recovery
difficulty: hard
environment: sandboxed_fs
grader:
  kind: numeric_file_equals
  config:
    path: output.txt
    expected: 1.0
    tolerance: 1.0e-06
timeout_seconds: 10.0
max_steps: 8
metadata:
  initial_files:
    input.txt: 1000000.0 -1000000.0 1
