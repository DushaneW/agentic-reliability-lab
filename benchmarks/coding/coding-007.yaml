id: coding-007
description: input.txt contains a list of numbers. Compute their sum and write the
  result to output.txt.
category: coding
difficulty: hard
environment: sandboxed_fs
grader:
  kind: numeric_file_equals
  config:
    path: output.txt
    expected: -57.4
    tolerance: 1.0e-06
timeout_seconds: 10.0
max_steps: 8
metadata:
  initial_files:
    input.txt: 17.51 1.5 -45.4 32.44 -43.69 -19.76
