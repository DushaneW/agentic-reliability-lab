id: coding-001
description: input.txt contains a list of numbers. Compute their sum and write the
  result to output.txt.
category: coding
difficulty: medium
environment: sandboxed_fs
grader:
  kind: numeric_file_equals
  config:
    path: output.txt
    expected: -50.81
    tolerance: 1.0e-06
timeout_seconds: 10.0
max_steps: 8
metadata:
  initial_files:
    input.txt: -38.31 -40.94 44.25 30.7 -46.51
