id: coding-004
description: input.txt contains a list of numbers. Compute their sum and write the
  result to output.txt.
category: coding
difficulty: medium
environment: sandboxed_fs
grader:
  kind: numeric_file_equals
  config:
    path: output.txt
    expected: -31.269999999999996
    tolerance: 1.0e-06
timeout_seconds: 10.0
max_steps: 8
metadata:
  initial_files:
    input.txt: 14.83 -1.58 -3.65 -40.87
