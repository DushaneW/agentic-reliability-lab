id: tool-use-004
description: input.txt contains a list of numbers. Compute their sum and write the
  result to output.txt.
category: tool_use
difficulty: medium
environment: sandboxed_fs
grader:
  kind: numeric_file_equals
  config:
    path: output.txt
    expected: 463.8
    tolerance: 1.0e-06
timeout_seconds: 10.0
max_steps: 8
metadata:
  initial_files:
    input.txt: 81.5 29.6 12.4 18.6 43.6 11.9 53.0 82.9 48.5 81.8
