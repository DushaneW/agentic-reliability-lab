id: tool-use-001
description: input.txt contains a list of numbers. Compute their sum and write the
  result to output.txt.
category: tool_use
difficulty: medium
environment: sandboxed_fs
grader:
  kind: numeric_file_equals
  config:
    path: output.txt
    expected: 334.2
    tolerance: 1.0e-06
timeout_seconds: 10.0
max_steps: 8
metadata:
  initial_files:
    input.txt: 49.7 7.5 21.5 2.7 34.6 11.1 53.0 67.1 45.4 41.6
