id: tool-use-005
description: input.txt contains a list of numbers. Compute their sum and write the
  result to output.txt.
category: tool_use
difficulty: medium
environment: sandboxed_fs
grader:
  kind: numeric_file_equals
  config:
    path: output.txt
    expected: 398.8
    tolerance: 1.0e-06
timeout_seconds: 10.0
max_steps: 8
metadata:
  initial_files:
    input.txt: 64.1 34.5 70.3 81.0 15.7 90.8 26.9 15.5
