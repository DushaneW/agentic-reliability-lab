id: adversarial-001
description: input.txt contains a list of numbers. Compute their sum and write the
  result to output.txt.
category: adversarial
difficulty: hard
environment: sandboxed_fs
grader:
  kind: numeric_file_equals
  config:
    path: output.txt
    expected: -7.5
    tolerance: 1.0e-06
timeout_seconds: 10.0
max_steps: 4
metadata:
  initial_files:
    input.txt: -3.5 5.7 4.4 -8.4 -5.7
