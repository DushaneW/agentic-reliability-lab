id: diverse-010
description: 'scores.txt contains five integer scores, one per line. Write to output.txt the highest score,
  a space, then the average of all five scores rounded to 1 decimal place (for example: 90 85.2).'
category: long_horizon
difficulty: hard
environment: sandboxed_fs
grader:
  kind: file_equals
  config:
    path: output.txt
    expected: 95 82.8
timeout_seconds: 30.0
max_steps: 14
metadata:
  initial_files:
    scores.txt: '88

      92

      79

      95

      60'
