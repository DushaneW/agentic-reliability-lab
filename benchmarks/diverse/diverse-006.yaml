id: diverse-006
description: config.txt contains the name of another file. Read that file and write its content, converted
  to uppercase, to output.txt.
category: multi_step
difficulty: medium
environment: sandboxed_fs
grader:
  kind: file_equals
  config:
    path: output.txt
    expected: HELLO FROM THE SECOND FILE
timeout_seconds: 30.0
max_steps: 10
metadata:
  initial_files:
    config.txt: target.txt
    target.txt: hello from the second file
