[project]
name = "arl"
version = "0.1.0"
description = "Agentic Reliability Lab: benchmark, trace, and diagnose autonomous agent failures before they happen."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
    "pydantic>=2.7",
    "typer>=0.12",
    "rich>=13.7",
    "pyyaml>=6.0",
    "scikit-learn>=1.5",
    "numpy>=1.26",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "jinja2>=3.1",
]

[project.scripts]
arl = "arl.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arl"]


[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
    "httpx2",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N"]
# Typer's idiomatic API requires calling typer.Option()/typer.Argument() in
# argument defaults for CLI parameter metadata to work.
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# Embedded HTML/JS template string, not Python line-length rules.
"src/arl/dashboard/app.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
explicit_package_bases = true
exclude = ["tests", "examples", "scripts"]

[[tool.mypy.overrides]]
module = ["sklearn.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
