name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you do, and what went wrong?
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected instead
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Exact commands, if possible (`arl benchmark run ...`, etc.)
      render: shell
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: arl / Python version
      placeholder: "arl 0.1.0, Python 3.12.3"
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant output or traceback
      render: shell
